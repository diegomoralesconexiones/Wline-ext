allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# Del fork (spec w033): versiones mínimas para dependencias transitivas con
# vulnerabilidades altas (CONSTRAINTS.md, fila «Dependencias»). Solo suben
# dentro de la misma mayor. Si una actualización de Kevin choca en
# pnpm-lock.yaml, se toma el suyo y `pnpm install` las vuelve a aplicar; cuando
# su lockfile ya traiga la versión, la línea sobra y se borra.
overrides:
  postcss: ^8.5.18
  sharp: ^0.35.5
  zod@^4: ^4.6.6
  nanoid@^3: ^3.3.18
  source-map-js: ^1.2.2
  browserslist: ^4.28.7
  brace-expansion@^1: ^1.1.20
  brace-expansion@^5: ^5.0.11
  js-yaml@^4: ^4.3.2
  shell-quote: ^1.11.0
